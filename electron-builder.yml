appId: dev.twirly.app
productName: Twirly
copyright: Copyright © 2026 Mark
directories:
  output: release
  buildResources: build

# Only the built app and runtime dependencies (sharp, pdf-lib, zod) ship. React, pdf.js etc.
# are bundled into out/renderer by Vite.
files:
  - out/**
  - package.json
  - '!**/*.map'
  # ONNX Runtime: only the Windows x64 CPU build (no macOS/Linux/ARM binaries, no DirectML GPU DLLs).
  - '!node_modules/onnxruntime-node/bin/napi-v*/{darwin,linux}/**'
  - '!node_modules/onnxruntime-node/bin/napi-v*/win32/arm64/**'
  - '!node_modules/onnxruntime-node/bin/napi-v*/win32/x64/{DirectML,dxcompiler,dxil}.dll'

# sharp loads native libvips binaries; they cannot be loaded from inside an asar archive.
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/onnxruntime-node/**

extraResources:
  - from: native/windows-helper/bin/publish/TwirlyHelper.exe
    to: helper/TwirlyHelper.exe
  # FFmpeg (GPL, separate executables) so video/audio/HEIC need no extra install. `npm run ffmpeg:fetch`.
  - from: vendor/ffmpeg
    to: ffmpeg
  # Background-removal model (IS-Net, Apache-2.0). `npm run models:fetch`.
  - from: vendor/models
    to: models
  - from: assets
    to: assets
    filter:
      - tray.png
      - tray@2x.png
      - icon.png

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png
  executableName: Twirly
  # Code signing is not configured; see docs/release.md.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Twirly
  uninstallDisplayName: Twirly
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  artifactName: Twirly-Setup-${version}.${ext}
publish: null
